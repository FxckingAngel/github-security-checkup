name: self-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python check_repo.py FxckingAngel/github-security-checkup --summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
